# Deploys billykulpa.com to Hostinger on every push to main.
# The FTP account is rooted at public_html (Hostinger does not allow FTP
# accounts above the docroot), so public/ syncs to the root itself and
# app/ lives inside the docroot, blocked from the web by .htaccess.
# The server's app/config.php is excluded so production credentials
# never leave the server (and never enter this repo).
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync public/ to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: ./
          # Admin uploads (the About portrait) live only on the server —
          # never in git, never overwritten or deleted by a deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            assets/uploads/**

      - name: Sync app/ to app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: app/
          server-dir: app/
          exclude: |
            config.php
            cache/**
